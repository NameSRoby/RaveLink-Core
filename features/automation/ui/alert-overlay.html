<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaveLink Alerts</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI","Yu Gothic UI","Microsoft YaHei UI","Malgun Gothic",Arial,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}.stage{position:absolute;inset:0;display:grid;place-items:center;padding:5vw;pointer-events:none}.alert{min-width:min(620px,90vw);max-width:90vw;padding:24px 30px;border:2px solid #ef2860;border-radius:18px;background:rgba(7,10,18,.91);color:#fff;text-align:center;box-shadow:0 18px 70px rgba(0,0,0,.48);animation:arrive .35s cubic-bezier(.2,.8,.2,1)}.alert.celebration{border-color:#7c5cff;background:linear-gradient(135deg,rgba(10,14,28,.94),rgba(68,16,76,.92));animation:celebrate .5s cubic-bezier(.2,.9,.2,1)}.alert.minimal{min-width:0;border:0;border-radius:10px;background:rgba(7,10,18,.78);box-shadow:none}.label{color:#ff7097;font-size:14px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.celebration .label{color:#bdafff}h1{margin:7px 0 0;font-size:clamp(28px,5vw,58px);line-height:1.05;overflow-wrap:anywhere}p{margin:12px auto 0;max-width:900px;color:#e7eaff;font-size:clamp(18px,2.6vw,32px);line-height:1.25;overflow-wrap:anywhere}.hidden{display:none}@keyframes arrive{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}@keyframes celebrate{0%{opacity:0;transform:scale(.75) rotate(-2deg)}70%{transform:scale(1.04) rotate(1deg)}100%{opacity:1;transform:none}}
</style></head><body><main class="stage"><section id="alert" class="alert hidden" role="status" aria-live="polite"><div class="label">THANK YOU</div><h1 id="name"></h1><p id="message"></p></section></main>
<script>
const channel='ravelink-feature-ui-v1',pending=new Map();let sequence=0,lastId='';
function call(method,payload=null){return new Promise((resolve,reject)=>{const id=String(++sequence);pending.set(id,{resolve,reject});parent.postMessage({channel,type:'call',id,capability:'alerts.visual.read.v1',method,payload},'*')})}
addEventListener('message',event=>{if(event.source!==parent)return;const m=event.data;if(m?.channel!==channel)return;if(m.type==='event'||m.type==='resync'){void refresh();return}const task=pending.get(m.id);if(!task)return;pending.delete(m.id);m.ok?task.resolve(m.value):task.reject(new Error('unavailable'))});
function render(value){const box=document.getElementById('alert'),name=document.getElementById('name'),message=document.getElementById('message'),alert=value?.alert;if(!alert){box.className='alert hidden';name.textContent='';message.textContent='';lastId='';return}box.className=`alert ${alert.theme}`;name.textContent=alert.name;message.textContent=alert.message;message.hidden=!alert.message;if(lastId!==alert.id){box.style.animation='none';void box.offsetWidth;box.style.animation='';lastId=alert.id}}
async function refresh(){try{render(await call('status'))}catch{render(null)}}
void refresh();setInterval(refresh,15000);
</script></body></html>
