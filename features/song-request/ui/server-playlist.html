<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server Playlists</title><style>
:root{color-scheme:dark;--bg:#050507;--control:#0a1020;--edge:#263755;--text:#eef3ff;--muted:#8fa0be;--accent:#b31132;--ok:#57d487;--bad:#ff6b72}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif;letter-spacing:0}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--edge);background:#080b12}h1{margin:0;font-size:18px}.status{font-size:11px;font-weight:800;color:var(--muted)}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}main{padding:16px 18px}.band{display:flex;align-items:end;gap:8px;flex-wrap:wrap;padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--edge)}label{display:grid;gap:5px;color:#a9bce0;font-size:10px;font-weight:700}input,select{height:40px;min-width:180px;border:1px solid var(--edge);border-radius:4px;background:#050914;color:var(--text);padding:0 10px;font:inherit}input.wide{width:min(520px,55vw)}button{height:40px;border:1px solid var(--edge);border-radius:5px;background:var(--control);color:var(--text);padding:0 12px;font:inherit;font-weight:800;cursor:pointer}button:hover:not(:disabled){border-color:#5c76a4}button.primary{background:var(--accent);border-color:var(--accent)}button.danger{color:#ff9fa4}button:disabled{opacity:.45;cursor:not-allowed}.spacer{flex:1}.importState{width:100%;min-height:18px;color:var(--muted);font-size:12px}.importState.bad{color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--edge);vertical-align:middle}th{color:var(--muted);font-size:10px}td:last-child,th:last-child{text-align:right}.track strong,.track span{display:block}.track span{margin-top:3px;color:var(--muted);font-size:11px}.empty{padding:36px 8px;color:var(--muted);text-align:center!important}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:14px}.notice{min-height:20px;margin-right:auto;color:var(--muted);font-size:12px}.notice.bad{color:var(--bad)}@media(max-width:720px){main{padding:10px}header{padding:0 10px}.spacer{display:none}.band>*{max-width:100%}input.wide{width:100%}.hideSmall{display:none}}
</style><style>.switchLabel{display:flex;align-items:center;gap:9px;height:40px}.switchLabel input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 40px;width:40px!important;min-width:40px!important;height:22px!important;margin:0;border:1px solid #415173;border-radius:999px;background:#050914;padding:0;cursor:pointer}.switchLabel input[type=checkbox]::before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8793aa;transition:transform .16s}.switchLabel input[type=checkbox]:checked{border-color:#238f4b;background:#124f2b}.switchLabel input[type=checkbox]:checked::before{transform:translateX(18px);background:#eafff1}dialog{width:min(430px,calc(100vw - 24px));border:1px solid var(--edge);border-radius:7px;background:#080d18;color:var(--text);padding:18px;box-shadow:0 16px 50px #000}dialog::backdrop{background:#000b}dialog h2{margin:0 0 8px;font-size:17px}dialog p{color:var(--muted);line-height:1.5}.dialogActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}</style></head><body><header><h1>RAVELINK // SERVER PLAYLISTS</h1><span id="connection" class="status">CONNECTING</span></header><main>
<div class="band"><label>ACTIVE PLAYLIST<select id="collections"></select></label><button id="create" title="Create an empty server playlist">NEW</button><button id="rename" title="Rename the selected server playlist">RENAME</button><button id="delete" class="danger" title="Delete the selected playlist; at least one playlist is always kept">DELETE</button><span class="spacer"></span><span id="capacity" class="status">0 / 2500 TRACKS</span></div>
<div class="band"><label class="switchLabel" title="Keep successfully completed viewer requests in the selected server playlist. Skipped and failed requests are not saved."><input id="saveHistory" type="checkbox"> SAVE PLAYED CHAT REQUESTS</label><label>SAVE INTO<select id="historyDestination"></select></label><button id="saveHistoryPolicy" title="Save successfully completed viewer requests; skipped and failed songs are excluded">SAVE HISTORY POLICY</button><span class="spacer"></span><span class="status">CHAT REQUESTS IS ALWAYS KEPT</span></div>
<div class="band"><label>PLAYLIST URL<input id="importUrl" class="wide" maxlength="500" placeholder="YouTube or SoundCloud playlist URL"></label><label>OPTIONAL NAME<input id="importName" maxlength="80" placeholder="Use source title"></label><button id="import" class="primary" title="Import up to 2,500 unique playable tracks from a public YouTube or SoundCloud playlist">IMPORT</button><button id="cancel" class="danger" disabled title="Cancel the active playlist import">CANCEL</button><div id="importState" class="importState">YOUTUBE PLAYLISTS // SOUNDCLOUD REQUIRES THE OPTIONAL ALPHA FEATURE</div></div>
<div class="band"><button id="play" title="Start this playlist in order whenever the request queue is empty">PLAY</button><button id="shuffle" title="Start this playlist in shuffle mode whenever the request queue is empty">SHUFFLE</button><button id="random" title="Pick a non-empty server playlist at random and start it in shuffle mode">PICK RANDOM</button><button id="stop" title="Stop background playlist playback without changing its tracks">STOP</button><button id="clear" class="danger" title="Remove every track from the selected playlist">CLEAR TRACKS</button><span class="spacer"></span><span id="mode" class="status">OFF</span></div>
<table><thead><tr><th>TRACK</th><th class="hideSmall">SOURCE</th><th>ACTIONS</th></tr></thead><tbody id="playlist"><tr><td class="empty" colspan="3">PLAYLIST EMPTY</td></tr></tbody></table><div class="pager"><span id="notice" class="notice" role="status"></span><button id="previous">PREVIOUS</button><span id="page" class="status">PAGE 1</span><button id="next">NEXT</button></div>
</main><dialog id="deleteDialog"><h2>Delete this playlist?</h2><p id="deleteMessage">This removes the server playlist. This action cannot be undone.</p><div class="dialogActions"><button id="cancelDelete" type="button">KEEP PLAYLIST</button><button id="confirmDelete" class="danger" type="button">DELETE PLAYLIST</button></div></dialog><script>
const CHANNEL="ravelink-feature-ui-v1",PAGE_SIZE=10;let sequence=0,offset=0,refreshing=false,queued=false,pollTimer=null;const pending=new Map(),listeners=new Set(),$=id=>document.getElementById(id);
window.addEventListener("message",event=>{if(event.source!==parent||event.data?.channel!==CHANNEL)return;const message=event.data;if(message.type==="transport-error"){$("connection").textContent="UPDATES OFFLINE";$("connection").className="status bad";return}if(message.type==="event"||message.type==="resync"){for(const listener of listeners)listener();return}const active=pending.get(message.id);if(!active)return;pending.delete(message.id);message.ok?active.resolve(message.value):active.reject(new Error(message.error||"Feature call failed"))});
function call(capability,method,payload=null){const id=`ui-${++sequence}`;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});parent.postMessage({channel:CHANNEL,type:"call",id,capability,method,payload},"*")})}
function notice(value,bad=false){$("notice").textContent=value;$("notice").className=`notice${bad?" bad":""}`}
function actionButton(label,title,handler){const button=document.createElement("button");button.textContent=label;button.title=title;button.onclick=handler;return button}
function render(library,queue){const selected=library.collections.find(row=>row.id===library.selectedId),select=$("collections"),current=select.value;select.replaceChildren(...library.collections.map(item=>{const option=document.createElement("option");option.value=item.id;option.textContent=`${item.name} (${item.count})`;return option}));select.value=library.selectedId||current;const destination=$("historyDestination");destination.replaceChildren(...library.collections.map(item=>{const option=document.createElement("option");option.value=item.id;option.textContent=item.name;return option}));destination.value=library.history?.destinationId||"";$("saveHistory").checked=library.history?.enabled===true;$("delete").disabled=selected?.purpose==="chat-history";$("capacity").textContent=`${selected?.count||0} / ${library.limits.tracksPerCollection} TRACKS`;const mode=queue.playlistState?.mode||"off";$("mode").textContent=mode.toUpperCase();$("mode").className=`status${mode==="off"?"":" ok"}`;$("previous").disabled=offset===0;$("next").disabled=!library.page.hasMore;$("page").textContent=`PAGE ${Math.floor(offset/PAGE_SIZE)+1} / ${Math.max(1,Math.ceil(library.page.total/PAGE_SIZE))}`;const body=$("playlist");body.replaceChildren();if(!library.tracks.length){if(offset){offset=Math.max(0,offset-PAGE_SIZE);void refresh();return}const row=body.insertRow(),cell=row.insertCell();cell.colSpan=3;cell.className="empty";cell.textContent="PLAYLIST EMPTY"}for(const item of library.tracks){const row=body.insertRow(),track=row.insertCell();track.className="track";const title=document.createElement("strong"),artist=document.createElement("span");title.textContent=item.candidate?.title||"Untitled";artist.textContent=(item.candidate?.artists||[]).join(", ")||item.candidate?.provider||"Unknown";track.append(title,artist);const source=row.insertCell();source.className="hideSmall";source.textContent=`${item.candidate?.provider||""} // ${item.candidate?.providerItemId||""}`;row.insertCell().append(actionButton("REMOVE","Remove this track from the selected playlist",()=>moderate({action:"playlist_remove",playlistId:item.id},"Track removed.")))}const job=library.import,busy=job?.state==="running"||job?.state==="transferring";$("cancel").disabled=!busy;$("import").disabled=busy;$("importState").textContent=job?.state==="running"?`READING ${(job.provider||"PLAYLIST").toUpperCase()} // LARGE LISTS MAY TAKE A FEW MINUTES`:job?.state==="transferring"?`SAVING // ${job.transferred||0} / ${job.count} TRACKS`:job?.state==="failed"?`IMPORT FAILED // ${job.error||"UNKNOWN ERROR"}`:job?.state==="complete"?`IMPORTED ${job.count} TRACKS${job.truncated?" // 2500 LIMIT REACHED":""}`:"YOUTUBE PLAYLISTS // SOUNDCLOUD REQUIRES THE OPTIONAL ALPHA FEATURE";$("importState").className=`importState${job?.state==="failed"?" bad":""}`;clearTimeout(pollTimer);if(busy)pollTimer=setTimeout(()=>void refresh(),1000)}
async function refresh(){if(refreshing){queued=true;return}refreshing=true;try{const [library,queue]=await Promise.all([call("song.playlist.read.v1","status",{offset,limit:PAGE_SIZE}),call("song.queue.read.v1","status",{limit:1,playlistLimit:1})]);render(library,queue);$("connection").textContent="CONNECTED";$("connection").className="status ok"}catch(error){$("connection").textContent="DISCONNECTED";$("connection").className="status bad";notice(error.message,true)}finally{refreshing=false;if(queued){queued=false;void refresh()}}}
async function mutate(payload,message){try{const result=await call("song.playlist.admin.v1","mutate",payload);if(!result.ok)throw new Error(result.code||"Playlist update failed");notice(message);offset=0;await refresh()}catch(error){notice(error.message,true)}}
async function moderate(payload,message){try{const result=await call("song.queue.admin.v1","moderate",payload);if(!result.ok)throw new Error(result.reason||result.code||"Playlist update failed");notice(message);await refresh()}catch(error){notice(error.message,true)}}
$("saveHistoryPolicy").onclick=()=>mutate({action:"configure_history",enabled:$("saveHistory").checked,destinationId:$("historyDestination").value},"Played-request history policy saved.");$("collections").onchange=()=>mutate({action:"select",collectionId:$("collections").value},"Playlist selected.");$("create").onclick=()=>{const name=prompt("New playlist name:");if(name)void mutate({action:"create",name},"Playlist created.")};$("rename").onclick=()=>{const name=prompt("Playlist name:",$("collections").selectedOptions[0]?.textContent.replace(/ \(\d+\)$/,""));if(name)void mutate({action:"rename",collectionId:$("collections").value,name},"Playlist renamed.")};$("delete").onclick=()=>{if(confirm("Delete this server playlist?"))void mutate({action:"delete",collectionId:$("collections").value},"Playlist deleted.")};$("import").onclick=()=>{const url=$("importUrl").value.trim();if(!url)return notice("Enter a YouTube or SoundCloud playlist URL.",true);void mutate({action:"import",url,name:$("importName").value.trim()},"Import started.")};$("cancel").onclick=()=>mutate({action:"cancel_import"},"Import canceled.");$("play").onclick=()=>moderate({action:"playlist_play"},"Sequential playback started.");$("shuffle").onclick=()=>moderate({action:"playlist_shuffle"},"Shuffle playback started.");$("random").onclick=()=>mutate({action:"play_random"},"A random server playlist was selected and started.");$("stop").onclick=()=>moderate({action:"playlist_stop"},"Playlist playback stopped.");$("clear").onclick=()=>{if(confirm("Clear every track from this playlist?"))void moderate({action:"playlist_clear"},"Playlist cleared.")};$("previous").onclick=()=>{offset=Math.max(0,offset-PAGE_SIZE);void refresh()};$("next").onclick=()=>{offset+=PAGE_SIZE;void refresh()};listeners.add(()=>void refresh());void refresh();
const deleteDialog=$("deleteDialog");$("delete").onclick=()=>{const option=$("collections").selectedOptions[0];$("deleteMessage").textContent=`Delete ${option?.textContent?.replace(/ \(\d+\)$/,"")||"this playlist"}? Its saved tracks will be removed. This action cannot be undone.`;deleteDialog.showModal()};$("cancelDelete").onclick=()=>deleteDialog.close();$("confirmDelete").onclick=()=>{const collectionId=$("collections").value;deleteDialog.close();void mutate({action:"delete",collectionId},"Playlist deleted.")};deleteDialog.addEventListener("click",event=>{if(event.target===deleteDialog)deleteDialog.close()});
</script></body></html>
