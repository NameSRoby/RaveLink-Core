<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Request Player</title><style>

</style></head><body><header><h1>RAVELINK // SONG REQUEST</h1><span id="connection" class="status">CONNECTING</span></header><main><section class="playerSide"><div id="playerFrame"></div><div class="now"><div><strong id="nowTitle">NOTHING PLAYING</strong><span id="nowArtist">QUEUE READY</span></div><span id="nowProvider" class="status">LOCAL PLAYER</span></div><div class="actions"><button id="skip" class="danger" type="button" title="Skip the currently playing queue item">SKIP</button><button id="refresh" type="button" title="Refresh queue and playback state">REFRESH</button><button id="openOverlay" type="button" title="Open the OBS overlay in a separate view">OPEN OBS OVERLAY</button></div><label class="volumeControl"><div><span>PLAYER VOLUME</span><output id="volumeOut">100 // OUTPUT 40%</output></div><input id="volume" type="range" min="0" max="100" value="100"></label><div id="notice" class="notice" role="status"></div></section><section class="queueSide"><h2>REQUEST POLICY</h2><div class="settingsGrid"><label>VIEWER QUEUE LIMIT<input id="viewerLimit" type="number" min="1" max="20" value="5"></label><label>VIP QUEUE LIMIT<input id="vipLimit" type="number" min="1" max="40" value="10"></label><label>MAXIMUM AUDIO OUTPUT %<input id="volumeCeiling" type="number" min="1" max="100" value="40" title="Map the player volume control to this maximum actual YouTube output"></label><button id="savePolicy" type="button">SAVE POLICY</button></div><h2>ADD SONG</h2><form id="requestForm" class="requestForm" novalidate><label>SONG NAME OR TRUSTED LINK<input id="videoInput" autocomplete="off" placeholder="Artist and song, YouTube, or Spotify"></label><label>OPTIONAL TITLE OVERRIDE<input id="titleInput" maxlength="200" autocomplete="off" placeholder="For a direct video ID without search"></label><button id="addSong" class="primary" type="button">ADD</button></form><div id="requestNotice" class="notice requestNotice" role="status">Enter a song name or a trusted YouTube or Spotify link.</div><div class="actions"><button id="pause" type="button">PAUSE INTAKE</button><button id="resume" type="button">RESUME</button><button id="clear" class="danger" type="button">CLEAR QUEUE</button></div><h2 id="queueHeading">PLAY NEXT // FIFO</h2><table><thead><tr><th>TRACK</th><th>REQUESTER</th><th class="hideSmall">POSITION</th><th>ACTIONS</th></tr></thead><tbody id="queue"><tr><td class="empty" colspan="4">QUEUE EMPTY</td></tr></tbody></table><h2>RECENT REQUESTERS</h2><table><thead><tr><th>USER</th><th>PENDING</th><th class="hideSmall">POSITION</th><th>ACTIONS</th></tr></thead><tbody id="requesters"><tr><td class="empty" colspan="3">NO REQUESTERS YET</td></tr></tbody></table></section></main><script>
const FEATURE="song-request";const DRIVER="youtube-local-ui";const CHANNEL="ravelink-feature-ui-v1";let sequence=0;const pendingCalls=new Map();const eventListeners=new Set();let player=null;let playerReady=false;let lease=null;let starting=false;let refreshQueued=false;let refreshing=false;let volumeCeilingPercent=40;
const startPlayer=document.createElement("button");startPlayer.id="startPlayer";startPlayer.type="button";startPlayer.textContent="START PLAYER";startPlayer.title="Start or resume YouTube playback when browser autoplay is blocked";document.querySelector(".playerSide .actions").prepend(startPlayer);
document.querySelector("#requesters").closest("table").querySelector("thead .hideSmall")?.remove();
const $=id=>document.getElementById(id);const clean=value=>String(value??"");
const RESPONSE_LABELS=Object.freeze({queued:"SONG QUEUED",queue_failed:"QUEUE FAILED",now_playing:"NOW PLAYING",playback_failed:"PLAYBACK FAILED",skip_succeeded:"SKIP SUCCEEDED",skip_failed:"SKIP FAILED",remove_succeeded:"REMOVE SUCCEEDED",remove_failed:"REMOVE FAILED",song_ban_succeeded:"SONG BLOCK UPDATED",song_ban_failed:"SONG BLOCK FAILED",user_ban_succeeded:"USER BLOCKED",user_ban_failed:"USER ACCESS FAILED",user_restored:"USER RESTORED",user_timeout_succeeded:"USER TIMED OUT",user_timeout_failed:"TIMEOUT FAILED",user_timeout_removed:"TIMEOUT REMOVED",volume_changed:"VOLUME CHANGED",volume_failed:"VOLUME FAILED",intake_paused:"INTAKE PAUSED",intake_resumed:"INTAKE RESUMED"});
function installResponseControls(){const anchor=document.querySelector(".queueSide h2:nth-of-type(2)"),details=document.createElement("details"),summary=document.createElement("summary"),grid=document.createElement("div"),save=document.createElement("button"),status=document.createElement("span");details.style.cssText="margin:14px 0;border-bottom:1px solid var(--edge);padding-bottom:12px";summary.textContent="TWITCH CHAT RESPONSES // NATIVE OAUTH";summary.title="Choose which Song Request outcomes the broadcaster account posts to Twitch chat";summary.style.cssText="cursor:pointer;font-size:12px;font-weight:800;color:#cdd8ee;padding:8px 0";grid.id="responseToggles";grid.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;margin:10px 0";for(const [kind,label] of Object.entries(RESPONSE_LABELS)){const row=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.dataset.response=kind;input.style.cssText="width:auto;min-height:0;margin:0";row.style.cssText="display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;font-weight:800";row.append(input,label);grid.append(row)}save.id="saveResponses";save.type="button";save.textContent="SAVE CHAT RESPONSES";status.id="chatResponseStatus";status.className="status";status.style.marginLeft="10px";details.append(summary,grid,save,status);anchor.before(details);save.onclick=async()=>{const responses=Object.fromEntries([...grid.querySelectorAll("input")].map(input=>[input.dataset.response,input.checked]));try{await call("song.queue.admin.v1","configure",{responses});setNotice("Native Twitch chat responses saved.");await refreshState()}catch(error){setNotice(error.message,true)}}}
function renderResponses(state){for(const input of document.querySelectorAll("#responseToggles input"))input.checked=state.responses?.[input.dataset.response]===true;const chat=state.integrations?.chat||{},status=$("chatResponseStatus");status.textContent=chat.lastError?`CHAT ERROR // ${chat.lastError}`:chat.succeeded?`CHAT SENT // ${chat.succeeded}`:"NO CHAT RESPONSE ATTEMPTED";status.className=`status${chat.lastError?" bad":chat.succeeded?" ok":""}`}

const DERIVATIVE_LABELS={cover:"COVERS",instrumental:"INSTRUMENTALS",karaoke:"KARAOKE",remix:"REMIXES / BOOTLEGS",remaster:"REMASTERS",live:"LIVE PERFORMANCES",acoustic:"ACOUSTIC VERSIONS",slowed:"SLOWED VERSIONS",sped_up:"SPED-UP VERSIONS",nightcore:"NIGHTCORE",lyrics:"LYRIC VIDEOS",extended:"EXTENDED / LOOPS",edit:"EDITS",reaction:"REACTIONS",mashup:"MASHUPS",fanmade:"FAN-MADE / TRIBUTES",tutorial:"TUTORIALS",enhanced:"8D / BOOSTED / CLEAN"};
let catalogState=null;
function installCatalogControls(){
  const side=document.querySelector(".queueSide"),firstHeading=side.querySelector("h2"),details=document.createElement("details");
  details.id="catalogSettings";details.style.cssText="border-bottom:1px solid var(--edge);padding:0 0 12px;margin-bottom:12px";
  const summary=document.createElement("summary");summary.textContent="YOUTUBE SEARCH";summary.title="Choose the active YouTube resolver and configure result filters";summary.style.cssText="cursor:pointer;font-size:12px;font-weight:800;color:#cdd8ee;padding:8px 0";
  const setup=document.createElement("div");setup.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end";
  setup.innerHTML='<label style="display:grid;gap:5px;color:var(--muted);font-size:10px;font-weight:800">SEARCH PROVIDER<select id="catalogMode"><option value="keyless">KEYLESS // NO GOOGLE SETUP</option><option value="official">OFFICIAL DATA API</option></select></label><button id="saveCatalogMode" type="button">USE PROVIDER</button><label id="officialKeyField" style="display:grid;gap:5px;color:var(--muted);font-size:10px;font-weight:800">YOUTUBE DATA API KEY<input id="youtubeApiKey" type="password" autocomplete="new-password" maxlength="200" placeholder="WRITE-ONLY"></label><button id="saveCatalogKey" type="button">SAVE KEY</button><button id="clearCatalogKey" class="danger" type="button">DELETE KEY</button>';
  const policy=document.createElement("div");policy.className="settingsGrid";policy.style.gridTemplateColumns="repeat(3,minmax(140px,1fr))";policy.innerHTML='<label id="subscriberPolicy">MINIMUM CHANNEL SUBSCRIBERS<input id="minimumSubscribers" type="number" min="0" max="1000000000" value="100000"></label><label>MINIMUM VIDEO VIEWS<input id="minimumViews" type="number" min="0" max="1000000000" value="50000"></label><label>MINIMUM MATCH CONFIDENCE<input id="minimumConfidence" type="number" min="0.1" max="0.95" step="0.05" value="0.4"></label>';
  const mode=document.createElement("label");mode.style.cssText="display:flex;align-items:center;gap:7px;margin:10px 0;color:var(--muted);font-size:10px;font-weight:800";mode.innerHTML='<input id="allowNonMusic" type="checkbox" style="width:auto;min-height:0;margin:0"> ALLOW NON-MUSIC VIDEOS';
  const filters=document.createElement("div");filters.id="derivativeFilters";filters.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px;margin:10px 0";
  for(const [kind,label] of Object.entries(DERIVATIVE_LABELS)){const row=document.createElement("label");row.style.cssText="display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;font-weight:800";row.innerHTML=`<input type="checkbox" data-derivative="${kind}" style="width:auto;min-height:0;margin:0" checked> FILTER ${label} UNLESS REQUESTED`;filters.append(row)}
  const actions=document.createElement("div");actions.className="actions";actions.innerHTML='<button id="saveCatalogPolicy" type="button">SAVE SEARCH FILTERS</button><span id="catalogStatus" class="status">CHECKING PROVIDER</span>';
  details.append(summary,setup,policy,mode,filters,actions);firstHeading.before(details);$("videoInput").closest("label").firstChild.textContent="SONG QUERY OR TRUSTED LINK";$("videoInput").placeholder="Artist and song, YouTube link/ID, or Spotify track link";
  $("saveCatalogMode").onclick=async()=>{try{const selected=$("catalogMode").value;if(selected==="keyless"&&!confirm("Use unofficial keyless YouTube search? It requires no Google account but can break when YouTube changes its private interface."))return;const result=await call("song.catalog.admin.v1","configure",{mode:selected});if(!result.ok)throw new Error(result.error||"Search provider unavailable");setNotice(`${selected==="keyless"?"Keyless":"Official"} YouTube search selected.`);await refreshCatalog()}catch(error){setNotice(error.message,true)}};
  $("saveCatalogKey").onclick=async()=>{try{const result=await call("song.catalog.admin.v1","configure",{mode:"official",apiKey:$("youtubeApiKey").value.trim()});$("youtubeApiKey").value="";if(!result.ok)throw new Error(result.error||"YouTube key rejected");setNotice("YouTube API key saved and official search selected.");await refreshCatalog()}catch(error){setNotice(error.message,true)}};
  $("clearCatalogKey").onclick=async()=>{if(!confirm("Delete the saved YouTube API key? It cannot be displayed or recovered by RaveLink."))return;try{await call("song.catalog.admin.v1","clear",null);setNotice("YouTube API key deleted.");await refreshCatalog()}catch(error){setNotice(error.message,true)}};

}
async function refreshCatalog(){try{catalogState=await call("song.catalog.read.v1","status",null);const keyless=catalogState.mode==="keyless";$("catalogMode").value=catalogState.mode||"keyless";$("officialKeyField").hidden=keyless;$("saveCatalogKey").hidden=keyless;$("clearCatalogKey").hidden=keyless;$("minimumSubscribers").disabled=keyless;$("subscriberPolicy").title=keyless?"Keyless YouTube responses do not expose dependable subscriber counts. Verified artist, channel, Music catalog, and view evidence are used instead.":"Reject channels below this public subscriber count";$("catalogStatus").textContent=catalogState.configured?(keyless?`READY // KEYLESS ${catalogState.keyless?.version||""}`:`READY // ${catalogState.quota?.remaining??"-"} QUOTA UNITS`):(catalogState.unavailable?"PROVIDER UNAVAILABLE":keyless?"KEYLESS PROVIDER UNAVAILABLE":"API KEY REQUIRED");$("catalogStatus").className=`status${catalogState.configured?" ok":" bad"}`;const policy=catalogState.policy||{};$("minimumSubscribers").value=policy.minimumSubscribers??100000;$("minimumViews").value=policy.minimumViews??50000;$("minimumConfidence").value=policy.minimumConfidence??0.4;$("allowNonMusic").checked=policy.allowNonMusic===true;for(const input of document.querySelectorAll("#derivativeFilters input"))input.checked=policy.derivatives?.[input.dataset.derivative]!==false}catch(error){$("catalogStatus").textContent="PROVIDER UNAVAILABLE";$("catalogStatus").className="status bad"}}
installCatalogControls();
window.addEventListener("message",event=>{if(event.source!==parent||event.data?.channel!==CHANNEL)return;const message=event.data;if(message.type==="transport-error"){$("connection").textContent="UPDATES OFFLINE";$("connection").className="status bad";setNotice("Live updates unavailable. Reload this view.",true);return}if(message.type==="event"||message.type==="resync"){for(const listener of eventListeners)listener(message.message);return}const call=pendingCalls.get(message.id);if(!call)return;pendingCalls.delete(message.id);message.ok?call.resolve(message.value):call.reject(new Error(message.error||"Feature call failed"))});
function call(capability,method,payload=null){sequence+=1;const id=`ui-${sequence}`;return new Promise((resolve,reject)=>{pendingCalls.set(id,{resolve,reject});parent.postMessage({channel:CHANNEL,type:"call",id,capability,method,payload},"*")})}
function videoId(raw){const value=clean(raw).trim();if(/^[A-Za-z0-9_-]{11}$/.test(value))return value;try{const url=new URL(value);const host=url.hostname.toLowerCase();let id="";if(host==="youtu.be")id=url.pathname.split("/").filter(Boolean)[0]||"";else if(["youtube.com","www.youtube.com","music.youtube.com"].includes(host)){id=url.searchParams.get("v")||"";if(!id&&url.pathname.startsWith("/shorts/"))id=url.pathname.split("/")[2]||""}return /^[A-Za-z0-9_-]{11}$/.test(id)?id:""}catch{return ""}}
function setNotice(message,bad=false){$("notice").textContent=message;$("notice").className=`notice${bad?" bad":""}`}
function setRequestNotice(message,bad=false){$("requestNotice").textContent=message;$("requestNotice").className=`notice requestNotice${bad?" bad":""}`}
function actionButton(label,title,handler,danger=false){const button=document.createElement("button");button.type="button";button.textContent=label;button.title=title;button.className=danger?"danger":"";button.onclick=handler;return button}
async function moderate(payload,message){try{await call("song.queue.admin.v1","moderate",payload);setNotice(message||"Moderation updated.");await refreshState();await maybePull()}catch(error){setNotice(error.message,true)}}
function renderQueue(state){const body=$("queue"),rows=state.queue||[],total=state.counts?.queued||0;$("queueHeading").textContent=`PLAY NEXT // ${Math.min(3,total)} OF ${total} FIFO`;body.replaceChildren();if(!rows.length){const row=body.insertRow(),cell=row.insertCell();cell.colSpan=4;cell.className="empty";cell.textContent="QUEUE EMPTY";return}rows.forEach((item,index)=>{const row=body.insertRow();const track=row.insertCell();track.textContent=item.candidate?.title||item.query;const requester=row.insertCell();requester.textContent=item.requesterLabel||"Twitch user";const meta=document.createElement("div");meta.className="requesterMeta";meta.textContent=clean(item.requesterRole||"viewer");requester.append(meta);const position=row.insertCell();position.className="hideSmall";position.textContent=String(index+1);const actions=row.insertCell();actions.className="rowActions";actions.append(actionButton("REMOVE","Remove this queue item",()=>moderate({action:"remove",entryId:item.id},"Song removed.")),actionButton("BAN SONG","Block this YouTube video and remove matching requests",()=>moderate({action:"block_song",entryId:item.id},"Song blocked."),true))})}
function renderRequesters(state){const body=$("requesters"),rows=state.moderation?.recentRequesters||[];body.replaceChildren();if(!rows.length){const row=body.insertRow(),cell=row.insertCell();cell.colSpan=3;cell.className="empty";cell.textContent="NO REQUESTERS YET";return}rows.forEach(item=>{const row=body.insertRow();const user=row.insertCell();user.textContent=item.displayName;const meta=document.createElement("div");meta.className="requesterMeta";meta.textContent=`${item.role}${item.blocked?" // BANNED":item.timedOutUntil>Date.now()?" // TIMED OUT":""}`;user.append(meta);row.insertCell().textContent=String(item.pending||0);const actions=row.insertCell();actions.className="rowActions";actions.append(actionButton("10 MIN","Stop new requests for 10 minutes",()=>moderate({action:"timeout",requesterKey:item.requesterKey,minutes:10},`${item.displayName} timed out.`)),actionButton(item.blocked?"UNBAN":"BAN",item.blocked?"Restore Song Request access":"Ban from Song Request and remove pending songs",()=>moderate({action:item.blocked?"unblock":"block",requesterKey:item.requesterKey,removePending:true},`${item.displayName} updated.`),!item.blocked))})}
function renderPlayback(state){const current=state.primary;if(!current){$("nowTitle").textContent="NOTHING PLAYING";$("nowArtist").textContent="QUEUE READY";$("nowProvider").textContent="LOCAL PLAYER";return}const candidate=current.candidate||current;$("nowTitle").textContent=candidate.title||"UNTITLED";$("nowArtist").textContent=(candidate.artists||[]).join(", ")||current.album||"";$("nowProvider").textContent=clean(candidate.provider||current.provider||current.source).toUpperCase()}
async function refreshState(){if(refreshing){refreshQueued=true;return}refreshing=true;try{const [queueState,playback]=await Promise.all([call("song.queue.read.v1","status",{limit:3}),call("song.playback.read.v1","status",null)]);renderQueue(queueState);renderRequesters(queueState);renderPlayback(playback);renderResponses(queueState);$("viewerLimit").value=queueState.limits?.maxPerRequester||5;$("vipLimit").value=queueState.limits?.maxPerVip||10;volumeCeilingPercent=queueState.volume?.ceilingPercent??40;$("volumeCeiling").value=volumeCeilingPercent;$("volume").value=queueState.volume?.control??100;$("volumeOut").textContent=`${$("volume").value} // OUTPUT ${queueState.volume?.outputPercent??40}%`;player?.setVolume?.(queueState.volume?.outputPercent??40);if(lease&&playback.managed?.entryId!==lease.entryId){player?.stopVideo?.();lease=null}$("connection").textContent="CONNECTED";$("connection").className="status ok"}catch(error){$("connection").textContent="DISCONNECTED";$("connection").className="status bad";setNotice(error.message,true)}finally{refreshing=false;if(refreshQueued){refreshQueued=false;void refreshState()}}}
async function maybePull(){if(!playerReady||lease||starting)return;starting=true;try{const result=await call("song.playback.driver.v1","pull",{driverId:DRIVER,providers:["youtube"]});if(result.action){lease=result.action;player.loadVideoById(result.action.candidate.providerItemId)}}catch(error){setNotice(error.message,true)}finally{starting=false}}
async function acknowledge(state){if(!lease)return null;const active=lease;const result=await call("song.playback.driver.v1","acknowledge",{driverId:DRIVER,leaseId:active.leaseId,state,positionMs:Math.max(0,Math.trunc(player?.getCurrentTime?.()*1000||0)),durationMs:Math.max(0,Math.trunc(player?.getDuration?.()*1000||0))});if(["ended","failed","skipped"].includes(state))lease=null;return result}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player("playerFrame",{width:"100%",height:"100%",playerVars:{origin:location.origin,playsinline:1},events:{onReady:()=>{playerReady=true;startPlayer.textContent="PLAY";player.setVolume(Math.round(Number($("volume").value)*volumeCeilingPercent/100));void maybePull()},onStateChange:event=>{if(event.data===YT.PlayerState.PLAYING){startPlayer.textContent="PLAY";void acknowledge("started").then(refreshState)}if(event.data===YT.PlayerState.ENDED)void acknowledge("ended").then(()=>{void refreshState();void maybePull()})},onAutoplayBlocked:()=>{startPlayer.textContent="START PLAYER";setNotice("Browser autoplay is blocked. Select Start Player once to allow audio.",true)},onError:()=>void acknowledge("failed").then(()=>{void refreshState();void maybePull()})}})};
async function submitRequest(event){event?.preventDefault?.();const entered=$("videoInput").value.trim(),title=$("titleInput").value.trim(),query=entered||title,id=videoId(query),button=$("addSong"),idleLabel=button.textContent;if(!query){setRequestNotice("Enter a song name, trusted Spotify track link, YouTube URL, or video ID.",true);return}if(!id&&catalogState?.configured!==true){$("catalogSettings").open=true;setRequestNotice(catalogState?.mode==="official"?"Official YouTube search needs an API key. Add it above or select Keyless.":"The selected YouTube search provider is unavailable. Choose another provider above.",true);return}button.disabled=true;button.textContent=id?"ADDING":"SEARCHING";setRequestNotice(id?"Validating YouTube video...":"Searching for the closest eligible song...");try{const result=await call("song.queue.submit.v1","submit",{requestId:crypto.randomUUID(),requesterId:"local-operator",requesterName:"Local operator",requesterRole:"moderator",query,...(id?{candidate:{provider:"youtube",providerItemId:id,title:title||query,artists:[],durationMs:0}}:{})});if(!result.ok)throw new Error(result.reason||result.code||"Song was not accepted");$("videoInput").value="";$("titleInput").value="";const added=result.entry?.candidate?.title||"song";setRequestNotice(`Added ${added} to the queue.`);setNotice(`Added ${added} to the local queue.`);await refreshState();await maybePull()}catch(error){setRequestNotice(error.message,true);setNotice(error.message,true)}finally{button.disabled=false;button.textContent=idleLabel}}
$("requestForm").onsubmit=submitRequest;$("addSong").onclick=submitRequest;
$("skip").onclick=async()=>{try{if(lease){player.stopVideo();await acknowledge("skipped")}else await call("song.queue.admin.v1","moderate",{action:"skip"});await refreshState();await maybePull()}catch(error){setNotice(error.message,true)}};
startPlayer.onclick=()=>{if(!playerReady){setNotice("YouTube player is still loading. Try again in a moment.",true);return}if(lease)player.playVideo();else void maybePull()};
for(const [id,action] of [["pause","pause"],["resume","resume"],["clear","clear"]])$(id).onclick=async()=>{try{await call("song.queue.admin.v1","moderate",{action});if(action==="clear"&&lease){player.stopVideo();lease=null}await refreshState()}catch(error){setNotice(error.message,true)}};
$("savePolicy").onclick=async()=>{try{await call("song.queue.admin.v1","configure",{limits:{maxPerRequester:Number($("viewerLimit").value),maxPerVip:Number($("vipLimit").value)},volumeCeilingPercent:Number($("volumeCeiling").value)});setNotice("Request and audio policy saved.");await refreshState()}catch(error){setNotice(error.message,true)}};
$("volume").oninput=()=>{const output=Math.round(Number($("volume").value)*volumeCeilingPercent/100);$("volumeOut").textContent=`${$("volume").value} // OUTPUT ${output}%`;player?.setVolume?.(output)};$("volume").onchange=()=>void moderate({action:"volume",value:Number($("volume").value)},"Volume saved.");
$("refresh").onclick=()=>{void refreshState();void maybePull()};$("openOverlay").onclick=()=>parent.postMessage({channel:CHANNEL,type:"open",pageId:"obs-overlay"},"*");
eventListeners.add(()=>{void refreshState();void maybePull()});
void refreshState();void refreshCatalog();const script=document.createElement("script");script.src="https://www.youtube.com/iframe_api";script.onerror=()=>setNotice("YouTube player failed to load. Check the network connection and refresh.",true);document.head.appendChild(script);setTimeout(()=>{if(!playerReady)setNotice("YouTube player did not initialize. Refresh the Player tab to retry.",true)},10000);
