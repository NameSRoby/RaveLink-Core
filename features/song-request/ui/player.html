</style></head><body><header><h1>RAVELINK // SONG REQUEST</h1><span id="connection" class="status">CONNECTING</span></header><main><section class="playerSide"><div id="playerFrame"></div><div class="now"><div><strong id="nowTitle">NOTHING PLAYING</strong><span id="nowArtist">QUEUE READY</span></div><span id="nowProvider" class="status">LOCAL PLAYER</span></div><div class="actions"><button id="skip" class="danger" type="button" title="Skip the currently playing queue item">SKIP</button><button id="refresh" type="button" title="Refresh queue and playback state">REFRESH</button><button id="openOverlay" type="button" title="Open the OBS overlay in a separate view">OPEN OBS OVERLAY</button></div><label class="volumeControl"><div><span>PLAYER VOLUME</span><output id="volumeOut">100 // OUTPUT 40%</output></div><input id="volume" type="range" min="0" max="100" value="100"></label><div id="notice" class="notice" role="status"></div></section><section class="queueSide"><h2>REQUEST POLICY</h2><div class="settingsGrid"><label>VIEWER QUEUE LIMIT<input id="viewerLimit" type="number" min="1" max="20" value="5"></label><label>VIP QUEUE LIMIT<input id="vipLimit" type="number" min="1" max="40" value="10"></label><label>MINIMUM AUDIO OUTPUT %<input id="volumeFloor" type="number" min="0" max="100" value="0" title="Map zero on the player volume control to this minimum actual YouTube output"></label><label>MAXIMUM AUDIO OUTPUT %<input id="volumeCeiling" type="number" min="0" max="100" value="40" title="Map 100 on the player volume control to this maximum actual YouTube output"></label><button id="savePolicy" type="button">SAVE POLICY</button></div><h2>ADD SONG</h2><form id="requestForm" class="requestForm" novalidate><label>SONG NAME OR TRUSTED LINK<input id="videoInput" autocomplete="off" placeholder="Artist and song, YouTube, or Spotify"></label><label>OPTIONAL TITLE OVERRIDE<input id="titleInput" maxlength="200" autocomplete="off" placeholder="For a direct video ID without search"></l function installResponseControls(){const anchor=document.querySelector(".queueSide h2:nth-of-type(2)"),details=document.createElement("details"),summary=document.createElement("summary"),grid=document.createElement("div"),save=document.createElement("button"),status=document.createElement("span");details.style.cssText="margin:14px 0;border-bottom:1px solid var(--edge);padding-bottom:12px";summary.textContent="TWITCH CHAT RESPONSES // ALL PLAYERS";summary.title="Choose which Song Request outcomes the broadcaster account posts to Twitch chat";summary.style.cssText="cursor:pointer;font-size:12px;font-weight:800;color:#cdd8ee;padding:8px 0";grid.id="responseToggles";grid.addEventListener("change",()=>{responseDraftDirty=true});grid.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;margin:10px 0";for(const [kind,label] of Object.entries(RESPONSE_LABELS)){const row=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.dataset.response=kind;row.className="toggleSwitch";row.title=`Post a short Twitch chat message when ${label.toLowerCase()} occurs.`;row.append(input,label);grid.append(row)}save.id="saveResponses";save.type="button";save.textContent="SAVE CHAT RESPONSES";status.id="chatResponseStatus";status.className="status";status.style.marginLeft="10px";const help=document.createElement('p');help.textContent='Applies to YouTube, TIDAL, Spotify, and SoundCloud. Choose which Twitch request outcomes to announce. Now playing is sent when playback is confirmed; local test requests stay silent. Connect Twitch to send messages.';details.append(summary,help,grid,save,status);anchor.before(details);save.onclick=async()=>{const responses=Object.fromEntries([...grid.querySelectorAll("input")].map(input=>[input.dataset.response,input.checked]));try{await call("song.queue.admin.v1","configure",{responses});responseDraftDirty=false;setNotice("Native Twitch chat responses saved.");await refreshState()}catch(error){setNotice(error.message,true)}}}

async function refreshCatalog(){try{catalogState=await call("song.catalog.read.v1","status",null);const keyless=catalogState.mode==="keyless";$("catalogMode").value=catalogState.mode||"keyless";$("officialKeyField").hidden=keyless;$("saveCatalogKey").hidden=keyless;$("clearCatalogKey").hidden=keyless;$("minimumSubscribers").disabled=keyless;$("subscriberPolicy").title=keyless?"Keyless YouTube responses do not expose dependable subscriber counts. Verified artist, channel, Music catalog, and view evidence are used instead.":"Reject channels below this public subscriber count";$("catalogStatus").textContent=catalogState.configured?(keyless?`READY // KEYLESS ${catalogState.keyless?.version||""}`:`READY // ${catalogState.quota?.remaining??"-"} QUOTA UNITS`):(catalogState.unavailable?"PROVIDER UNAVAILABLE":keyless?"KEYLESS PROVIDER UNAVAILABLE":"API KEY REQUIRED");$("catalogStatus").className=`status${catalogState.configured?" ok":" bad"}`;const policy=catalogState.policy||{};$("minimumSubscribers").value=policy.minimumSubscribers??100000;$("minimumViews").value=policy.minimumViews??50000;$("minimumConfidence").value=policy.minimumConfidence??0.4;$("allowNonMusic").checked=policy.allowNonMusic===true;for(const input of document.querySelectorAll("#derivativeFilters input"))input.checked=policy.derivatives?.[input.dataset.derivative]!==false}catch(error){$("catalogStatus").textContent="PROVIDER UNAVAILABLE";$("catalogStatus").className="status bad"}}

function tidalErrorMessage(error) {
  const linkError=error.code||error.message;
  if(linkError==='catalog_untrusted_link'||linkError==='song_link_track_required')return 'Use a YouTube, Spotify, or TIDAL track link.';
  if(linkError==='song_link_metadata_unavailable')return 'Could not read this song link. Try the artist and title, or retry shortly.';
  if (error.message === 'song_timed_out') return 'This track is temporarily blocked. Try again after its timeout ends.';
  if (error.message === 'song_blocked') return 'This track is banned from song requests.';
  if (error.message === 'tidal_current_changed') return 'The playing track changed. Refresh Now Playing and choose the action again.';
  const code = error.code || error.message;
  const time = value => { const seconds = Math.floor(Number(value) / 1000); return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`; };
  if (code === 'duration_limit') {
    const details = error.details;
    return details ? `${details.title || 'Track'} is ${time(details.durationMs)}; your limit is ${time(details.maxDurationMs)}. Increase Maximum song length under Request limits, save, then try again.`
      : 'This track exceeds your maximum song length. Adjust Request limits, save, then try again.';
  }
  if (code === 'tidal_search_version_filtered') return 'Matching tracks were blocked by your version filters. Name the version you want (such as live or remaster), or adjust your search filters.';
  if (code === 'tidal_search_no_results') return 'TIDAL returned no tracks. Try the artist and song title, or a direct TIDAL track link.';
  if (code === 'tidal_search_no_eligible_match') return 'TIDAL returned tracks, but none matched closely enough. Try a clearer artist and song title, or a direct track link.';
  if (code === 'tidal_search_rate_limited') return 'Too many searches. Wait a minute, then try again.';
  if (code === 'tidal_catalog_setup_required' || code === 'tidal_oauth_sign_in_required' || code === 'tidal_oauth_refresh_rejected') return 'Sign in with TIDAL to search for songs, or use a direct track link.';
  if (code === 'tidal_api_credentials_rejected') return 'TIDAL rejected the account authorization. Disconnect and sign in again.';
  if (code === 'tidal_catalog_credentials_invalid') return 'Enter a valid public application client ID in Developer tools.';
  if (code === 'tidal_catalog_country_invalid') return 'Choose a supported country from the catalog country list.';
  if (code === 'tidal_catalog_access_denied') return 'TIDAL has not allowed song lookup for this app or account. Try reconnecting, or use a direct track link.';
  if (code === 'tidal_oauth_exchange_rejected') return 'TIDAL could not finish sign-in. Please try again, or use a direct track link.';
  if (code === 'tidal_oauth_scope_missing') return 'Song lookup permission was not granted. Sign in again and allow song lookup.';
  if (code === 'tidal_oauth_denied') return 'TIDAL sign-in was cancelled. You can try again.';
  if (code === 'tidal_oauth_state_invalid' || code === 'tidal_oauth_session_expired') return 'This sign-in expired or does not match. Start a new sign-in.';
  if (code === 'tidal_track_not_playable') return 'TIDAL could not validate this track as playable in your account. Try another recording or check its availability in TIDAL.';
  if (code === 'tidal_catalog_timeout' || code === 'tidal_metadata_timeout') return 'TIDAL lookup timed out. Try again shortly.';
  if (code === 'tidal_catalog_unavailable' || code === 'tidal_catalog_busy') return 'The TIDAL catalog API is unavailable right now. Retry shortly, or use a direct track link.';
  if (code === 'tidal_companion_rejected') return 'The desktop companion could not resolve this track. Update/reinstall the companion, then try again.';
  if (code === 'tidal_companion_update_required') return 'Open Setup and update the desktop companion, then reopen TIDAL to enable queue removal, skipping and moderation.';
  if (code === 'tidal_remove_unconfirmed') return 'TIDAL did not confirm removal. Check its queue, then retry this request’s removal if needed.';
  if (code === 'tidal_remove_unavailable') return 'TIDAL cannot skip or remove this request in its current playback state. Check the desktop player.';
  if (code === 'tidal_native_queue_full') return 'TIDAL already has 10 upcoming requests. This song will be sent automatically when a slot opens.';
  if (code === 'tidal_delivery_retry_required') return 'This request is held. Check its delivery status before choosing Retry in TIDAL.';

    $('catalogStatus').hidden = tidal; $('songSearchFilters').hidden = false;
    $('viewerLimit').closest('label').hidden = tidal; $('vipLimit').closest('label').hidden = tidal;
    nativeLimit.hidden = !tidal;
    tabs.setAttribute('aria-label', `${tidal ? 'TIDAL' : 'YouTube'} controls`);
    policy.hidden = false; policySummary.textContent = tidal ? 'Request limits & song length' : 'Request limits & song length';
    $('playerProviderHint').textContent = tidal ? 'Search songs · queue in order in TIDAL Desktop' : 'Embedded YouTube playback';
    $('videoInput').closest('label').firstChild.textContent = 'SONG QUERY OR TRUSTED LINK';
    $('videoInput').placeholder = 'Artist and song, YouTube, Spotify, or TIDAL track link';
    $('requestNotice').textContent = tidal ? 'Add an artist and song. Accepted requests are sent to TIDAL automatically, in order.' : 'Enter a song name or a YouTube, Spotify, or TIDAL track link.';
    $('requestNotice').className = 'notice requestNotice';
    const requesterTable = $('requesters').closest('table'); requesterTable.hidden = tidal; requesterTable.previousElementSibling.hidden = tidal;
    $('queue').closest('table').querySelectorAll('th')[2].textContent = tidal ? 'STATUS' : 'POSITION';
    $('clear').textContent = tidal ? 'CLEAR WAITING REQUESTS' : 'CLEAR QUEUE';
    if ($('tidalQueueTools')) $('tidalQueueTools').hidden = !tidal;

    if (view === 'moderation' || view === 'setup' && !tidal) void refreshCatalog();
    if (tidal) void refreshTidal(); else if (selected() === 'youtube' && view === 'player') ensureYoutubePlayer();
    const staleControls = $('tidalNowControls'); if (staleControls) staleControls.hidden = !tidal;
    void soundcloud.select(); void volumeControls.select(); spotify.select();
    void refreshState();
  }
  $('songPlayerProvider').onchange = async () => { const picker = $('songPlayerProvider'); providerReady = false; player?.pauseVideo?.(); picker.disabled = true; try { const result = await call('song.player.preferences.v1', 'select', { player: picker.value }); if (!result.ok) throw new Error('Could not save your player selection.'); savedPlayer = picker.value; providerReady = true; choosePlayer(); } catch(error) { picker.value = savedPlayer; providerReady = true; choosePlayer(); setNotice(error.message, true); } finally { picker.disabled = false; } };
  $('requestForm').onsubmit = submitForPlayer; $('addSong').onclick = submitForPlayer;
  $('monitorTidal').onclick = async () => { $('monitorTidal').disabled = true; try { await call('song.tidal.experimental.v1', 'monitor', {}); setNotice('TIDAL Windows monitoring enabled.'); await refreshState(); } catch (error) { setNotice(error.message, true); } finally { $('monitorTidal').disabled = false; } };
  async function refreshDelivery() { companionCheckedAt = 0; await refreshTidal(); if (selected() === 'tidal') { await call('song.tidal.experimental.v1', 'flush', {}); await refreshTidal(); } }
  $('refreshTidal').onclick = () => void refreshDelivery().catch(error => setNotice(tidalErrorMessage(error), true));
  const refreshPlayer = $('refresh').onclick;
  $('refresh').onclick = () => { refreshPlayer(); if (selected() === 'tidal') void refreshDelivery().catch(error => setNotice(tidalErrorMessage(error), true)); };
  $('installTidalCompanion').onclick = () => manageCompanion('install');
  $('updateTidalCompanion').onclick = () => manageCompanion('update');
  $('uninstallTidalCompanion').onclick = () => manageCompanion('uninstall');
  $('saveTidalCatalog').onclick = () => manageCatalogApi('configure');
  $('resetTidalClient').onclick = () => manageCatalogApi('reset-client');
  $('saveTidalRegion').onclick = () => manageCatalogApi('region');
  $('signInTidal').onclick = signInTidal;
  $('testTidalCatalog').onclick = () => manageCatalogApi('test');
  $('clearTidalCatalog').onclick = () => manageCatalogApi('disconnect');
  window.addEventListener('pagehide', () => { clearTimeout(loginTimer); clearTimeout(tidalRefreshTimer); loginTimer = null; });
  window.addEventListener('focus', () => { if (selected() === 'tidal') void refreshCatalogApi(); });

  window.addEventListener('message', event => {
    if (event.source !== parent || event.origin !== location.origin || event.data?.channel !== CHANNEL || event.data.type !== 'presentation') return;
    $('tidalDeveloperSettings').hidden = event.data.developerMode !== true;
  });
  eventListeners.add(() => { if (view === 'player' && selected() === 'tidal') { clearTimeout(tidalRefreshTimer); tidalRefreshTimer = setTimeout(() => void refreshTidal(), 150); } });
  $('songPlayerProvider').disabled = true; $('playerProviderHint').textContent = 'Restoring your player selection...';
  const playerRestored = (async () => { try { const saved = await call('song.player.preferences.v1', 'status', null); if (!saved.ok) throw new Error('Could not restore your player selection. Choose a player to retry.'); savedPlayer = saved.player; $('songPlayerProvider').value = saved.player; providerReady = true; choosePlayer(); } catch(error) { setNotice(error.message, true); } finally { $('songPlayerProvider').disabled = false; } })();
  let libraryStarting = false;
  window.addEventListener('message', async event => {
    if(event.source!==parent||event.origin!==location.origin||event.data?.channel!==CHANNEL||event.data.type!=='playlist-start'||!['youtube','soundcloud'].includes(event.data.provider)||libraryStarting)return;
    libraryStarting=true;
    try {
      await playerRestored;
      if($('songPlayerProvider').value!==event.data.provider){$('songPlayerProvider').value=event.data.provider;await $('songPlayerProvider').onchange();}
      if($('songPlayerProvider').value!==event.data.provider)throw new Error('Could not select the playlist player.');
      showView('player');
      if(event.data.provider==='soundcloud')await $('soundcloudStart').onclick();
      else {const deadline=Date.now()+12000;while(!playerReady&&Date.now()<deadline)await new Promise(resolve=>setTimeout(resolve,100));await startPlayer.onclick();}
    }catch(error){setNotice(error.message,true);}finally{libraryStarting=false;}
  });
})();
</script><!-- PLAYER PROVIDERS END --></body></html>
