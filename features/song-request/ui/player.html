function installResponseControls(){const anchor=document.querySelector(".queueSide h2:nth-of-type(2)"),details=document.createElement("details"),summary=document.createElement("summary"),grid=document.createElement("div"),save=document.createElement("button"),status=document.createElement("span");details.style.cssText="margin:14px 0;border-bottom:1px solid var(--edge);padding-bottom:12px";summary.textContent="TWITCH CHAT RESPONSES // NATIVE OAUTH";summary.title="Choose which Song Request outcomes the broadcaster account posts to Twitch chat";summary.style.cssText="cursor:pointer;font-size:12px;font-weight:800;color:#cdd8ee;padding:8px 0";grid.id="responseToggles";grid.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;margin:10px 0";for(const [kind,label] of Object.entries(RESPONSE_LABELS)){const row=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.dataset.response=kind;row.className="toggleSwitch";row.title=`Post a short Twitch chat message when ${label.toLowerCase()} occurs.`;row.append(input,label);grid.append(row)}save.id="saveResponses";save.type="button";save.textContent="SAVE CHAT RESPONSES";status.id="chatResponseStatus";status.className="status";status.style.marginLeft="10px";details.append(summary,grid,save,status);anchor.before(details);save.onclick=async()=>{const responses=Object.fromEntries([...grid.querySelectorAll("input")].map(input=>[input.dataset.response,input.checked]));try{await call("song.queue.admin.v1","configure",{responses});setNotice("Native Twitch chat responses saved.");await refreshState()}catch(error){setNotice(error.message,true)}}}
