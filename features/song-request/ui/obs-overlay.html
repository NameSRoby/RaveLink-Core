<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RaveLink Now Playing</title><style>
:root{--text:#fff;--muted:#d2d8e5;--accent:#e21d48;--surface:5,7,12;--opacity:.78;--radius:4px;--gap:6px;--pad:10px;--width:320px;--height:130px;--scale:1;--edge:4px;--shadow:.7}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important;color:var(--text);font:16px "Segoe UI","Yu Gothic UI","Yu Gothic",Meiryo,"Microsoft YaHei UI","Malgun Gothic",Arial,sans-serif;letter-spacing:0}.stage{position:absolute;display:flex;max-width:calc(100% - 24px);width:var(--width);gap:var(--gap);font-size:calc(16px * var(--scale));filter:drop-shadow(0 3px 5px rgba(0,0,0,var(--shadow)))}.stage.height-fixed{height:min(var(--height),calc(100% - 24px))}.stage.column{flex-direction:column}.stage.row{flex-direction:row;align-items:stretch}.stage.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.stage.content-center .segment{justify-content:center}.stage.content-end .segment{justify-content:flex-end}.stage.bottom-left{left:12px;bottom:12px}.stage.bottom-center{left:50%;bottom:12px;transform:translateX(-50%)}.stage.bottom-right{right:12px;bottom:12px}.stage.top-left{left:12px;top:12px}.stage.top-center{left:50%;top:12px;transform:translateX(-50%)}.stage.top-right{right:12px;top:12px}.segment{min-width:0;padding:0}.stage:not(.separated){padding:var(--pad);background:rgba(var(--surface),var(--opacity));border-left:var(--edge) solid var(--accent);border-radius:var(--radius)}.separated .segment{padding:var(--pad);background:rgba(var(--surface),var(--opacity));border-left:var(--edge) solid var(--accent);border-radius:var(--radius)}.stage.transparent:not(.separated),.stage.transparent.separated .segment{background:transparent;box-shadow:none}.segment.compact{flex:0 1 190px}.segment.wide{flex:1 1 320px}.segment.full{grid-column:1/-1;flex:1 1 100%}.align-center{text-align:center}.align-right{text-align:right}.label{font-size:calc(11px * var(--scale));font-weight:900;color:var(--accent)}h1{margin:2px 0 0;font-size:calc(21px * var(--scale));line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}p{margin:2px 0 0;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album{font-size:calc(12px * var(--scale))}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:calc(12px * var(--scale));font-weight:800}.bar{height:4px;margin-top:5px;background:rgba(40,48,68,.72)}.bar span{display:block;width:0;height:100%;background:var(--accent)}.queue{padding-top:5px;border-top:1px solid rgba(255,255,255,.3);font-size:calc(12px * var(--scale));font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artwork{padding:0!important;overflow:hidden;aspect-ratio:1;width:min(calc(180px * var(--scale)),100%)}.artwork img{display:block;width:100%;height:100%;object-fit:cover}.provider{font-size:calc(12px * var(--scale));font-weight:900;color:var(--accent)}.hidden{display:none!important}.subtle{animation:arrive .25s ease-out}.slide .segment{animation:slide-in .3s ease-out}@keyframes arrive{from{opacity:0}to{opacity:1}}@keyframes slide-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){.stage{width:min(var(--width),calc(100% - 24px))}.stage.row{flex-wrap:wrap}.stage.grid{grid-template-columns:1fr}}
.stage.column .segment{flex:none}.segment{display:flex}.segment.column{flex-direction:column}.segment.row{flex-direction:row;align-items:center}.block{min-width:0}.block.artwork{flex:0 0 auto}.block.queue{width:100%}
.titleViewport{display:block;width:100%;min-width:0;overflow:hidden}.marqueeTrack{display:flex;width:max-content;gap:var(--marquee-gap,32px);will-change:transform}.titleViewport h1{flex:none;margin:2px 0 0;font-size:calc(21px * var(--scale));line-height:1.15;overflow:visible;text-overflow:clip}.titleViewport.scrolling .marqueeTrack{animation:ticker var(--marquee-duration) linear infinite}.titleViewport.scrolling:hover .marqueeTrack{animation-play-state:paused}@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--marquee-distance)))}}
</style></head><body><main id="stage" class="stage hidden"></main><script>
const CHANNEL="ravelink-feature-ui-v1",SIZE_PX={small:10,medium:14,large:19,display:27},ARTWORK_PX={small:52,medium:80,large:110,display:150},BAR_PX={small:2,medium:4,large:7,display:10},CJK_FALLBACK='"Yu Gothic UI","Yu Gothic",Meiryo,"Microsoft YaHei UI","Malgun Gothic",sans-serif',FONT_STACK={system:`"Segoe UI",${CJK_FALLBACK}`,serif:`Georgia,"Yu Mincho","MS Mincho",${CJK_FALLBACK}`,mono:`Consolas,"MS Gothic",${CJK_FALLBACK}`,cjk:CJK_FALLBACK};let sequence=0,refreshing=false,pending=false,lastIdentity="",previewConfig=null,lastConfig=null,lastPlayback=null,lastRows=[],lastRenderedPlayback=null,lastRenderedConfig="",lastRenderedRows="";const pendingCalls=new Map(),eventListeners=new Set(),$=id=>document.getElementById(id);
window.addEventListener("message",event=>{if(event.source!==parent||event.data?.channel!==CHANNEL)return;const message=event.data;if(message.type==="transport-error"){void refresh();return}if(message.type==="preview"&&message.config){previewConfig=message.config;if(lastPlayback)render(previewConfig,lastPlayback,lastRows);return}if(message.type==="event"||message.type==="resync"){for(const listener of eventListeners)listener(message.message);return}const active=pendingCalls.get(message.id);if(!active)return;pendingCalls.delete(message.id);message.ok?active.resolve(message.value):active.reject(new Error(message.error||"unavailable"))});
function call(capability,method,payload=null){const id=`ui-${++sequence}`;return new Promise((resolve,reject)=>{pendingCalls.set(id,{resolve,reject});parent.postMessage({channel:CHANNEL,type:"call",id,capability,method,payload},"*")})}
const node=(tag,className,value)=>{const el=document.createElement(tag);if(className)el.className=className;if(value!==undefined)el.textContent=String(value);return el};
function clock(ms){const total=Math.max(0,Math.floor(Number(ms||0)/1000));return `${Math.floor(total/60)}:${String(total%60).padStart(2,"0")}`}
function rgb(hex){const clean=String(hex).slice(1);return `${parseInt(clean.slice(0,2),16)},${parseInt(clean.slice(2,4),16)},${parseInt(clean.slice(4,6),16)}`}
function titleBlock(value){const viewport=node("div","titleViewport block"),track=node("div","marqueeTrack"),title=node("h1","",value||"Untitled");track.append(title);viewport.append(track);return viewport}
function playbackPosition(current){const base=Math.max(0,Number(current.positionMs||0));if(current.status!=="playing")return base;const elapsed=Math.max(0,Date.now()-Number(current.observedAt||Date.now()));return Math.min(Number(current.durationMs||Infinity),base+elapsed)}
function clockData(el,current){el.dataset.playbackClock="";el.dataset.position=String(current.positionMs||0);el.dataset.duration=String(current.durationMs||0);el.dataset.observed=String(current.observedAt||Date.now());el.dataset.status=String(current.status||"");return el}
function timeBlock(current){return clockData(node("span","playbackTime",""),current)}
function progressBlock(current){const el=node("div","bar block"),fill=clockData(node("span","playbackProgress"),current);el.append(fill);return el}
function updateTimers(){document.querySelectorAll(".playbackTime").forEach(el=>{const current={positionMs:Number(el.dataset.position),durationMs:Number(el.dataset.duration),observedAt:Number(el.dataset.observed),status:el.dataset.status};el.textContent=current.durationMs?`${clock(playbackPosition(current))} / ${clock(current.durationMs)}`:""})}
function activateMarquees(){document.querySelectorAll(".titleViewport:not([data-marquee-ready])").forEach(viewport=>{const track=viewport.firstElementChild,title=track?.firstElementChild,available=viewport.clientWidth,width=Math.ceil(title?.getBoundingClientRect().width||0);if(!title||!available||!width)return;viewport.dataset.marqueeReady="true";if(width<=available+1)return;const gap=Math.max(28,Math.round(available*.12)),distance=width+gap,copy=title.cloneNode(true);copy.setAttribute("aria-hidden","true");track.style.setProperty("--marquee-gap",`${gap}px`);track.append(copy);viewport.classList.add("scrolling");viewport.style.setProperty("--marquee-distance",`${distance}px`);viewport.style.setProperty("--marquee-duration",`${Math.max(8,distance/32).toFixed(2)}s`)})}
function scheduleMarquees(){requestAnimationFrame(()=>requestAnimationFrame(activateMarquees));setTimeout(activateMarquees,250)}
function updatePlaybackUI(){document.querySelectorAll(".bar span:not([data-playback-clock])").forEach(el=>{el.classList.add("playbackProgress");clockData(el,lastPlayback||{})});document.querySelectorAll("[data-playback-clock]").forEach(el=>{const current={positionMs:Number(el.dataset.position),durationMs:Number(el.dataset.duration),observedAt:Number(el.dataset.observed),status:el.dataset.status},position=playbackPosition(current);if(el.classList.contains("playbackTime"))el.textContent=current.durationMs?`${clock(position)} / ${clock(current.durationMs)}`:"";else el.style.width=current.durationMs?`${Math.min(100,Math.max(0,position/current.durationMs*100))}%`:"0"})}
function applyBlockStyle(el,raw){const style=raw.style||{},target=raw.kind==="title"?el.querySelector("h1"):el;if(style.size&&style.size!=="inherit"&&SIZE_PX[style.size]){if(raw.kind==="artwork")el.style.width=`min(calc(${ARTWORK_PX[style.size]}px * var(--scale)),100%)`;else if(raw.kind==="progress")el.style.height=`${BAR_PX[style.size]}px`;else target.style.fontSize=`calc(${SIZE_PX[style.size]}px * var(--scale))`}if(style.font&&style.font!=="inherit"&&FONT_STACK[style.font])target.style.fontFamily=FONT_STACK[style.font];if(style.color){target.style.color=style.color;if(raw.kind==="progress"&&el.firstElementChild)el.firstElementChild.style.background=style.color}if(style.bold)target.style.fontWeight="800";if(style.italic)target.style.fontStyle="italic";if(style.uppercase)target.style.textTransform="uppercase";return el}
function block(raw,item,current,next){let el;if(raw.kind==="label")el=node("div","label block","NOW PLAYING");else if(raw.kind==="title")el=titleBlock(item.title);else if(raw.kind==="artists")el=node("p","block",(item.artists||[]).join(", "));else if(raw.kind==="album"){if(!item.album)return null;el=node("p","album block",item.album)}else if(raw.kind==="artwork"){if(!item.artworkUrl)return null;el=node("div","artwork block");const image=node("img");image.src=item.artworkUrl;image.alt="";image.referrerPolicy="no-referrer";el.append(image)}else if(raw.kind==="meta"){el=node("div","meta block");el.append(node("span","",String(item.provider||current.provider||current.source).toUpperCase()),timeBlock(current))}else if(raw.kind==="provider")el=node("div","provider block",String(item.provider||current.provider||current.source).toUpperCase());else if(raw.kind==="time"){el=node("div","meta block");el.append(timeBlock(current))}else if(raw.kind==="progress"){el=node("div","bar block");const fill=node("span");fill.style.width=current.durationMs?`${Math.min(100,Math.max(0,current.positionMs/current.durationMs*100))}%`:"0";el.append(fill)}else if(raw.kind==="queue"){const values=next.slice(0,raw.count||3);if(!values.length)return null;el=node("div","queue block",`NEXT  //  ${values.join("  /  ")}`)}return applyBlockStyle(el,raw)}
function rgba(hex,opacity){const clean=String(hex||"").slice(1),values=[0,2,4].map(index=>parseInt(clean.slice(index,index+2),16));return `rgba(${values.join(",")},${opacity/100})`}
function segment(raw,item,current,next,blockGap,config){const box=node("section",`segment ${raw.size} ${raw.direction} align-${raw.align}`),style=raw.style||{};box.style.gap=`${blockGap}px`;if(style.surface)box.style.background=rgba(style.surface,style.opacity??config.opacity);else if(style.opacity!==null&&style.opacity!==undefined)box.style.background=rgba(config.surface,style.opacity);if(style.accent)box.style.borderLeftColor=style.accent;if(style.padding!==null&&style.padding!==undefined)box.style.padding=`${style.padding}px`;if(style.radius!==null&&style.radius!==undefined)box.style.borderRadius=`${style.radius}px`;if(style.accentWidth!==null&&style.accentWidth!==undefined)box.style.borderLeftWidth=`${style.accentWidth}px`;if(Object.values(style).some(value=>value!==""&&value!==null&&value!==undefined))box.style.borderLeftStyle="solid";box.replaceChildren(...raw.blocks.map(value=>block(value,item,current,next)).filter(Boolean));return box.childElementCount?box:null}
function mediaKey(current){const item=current?.candidate||current||{};return [item.provider||current?.provider||"",item.providerItemId||"",item.title||current?.title||"",(item.artists||current?.artists||[]).join("\u0001"),item.album||"",item.artworkUrl||""].join("\u0000")}
function rowsKey(rows){return (rows||[]).map(row=>`${row.id||""}:${row.candidate?.title||row.query||""}`).join("\u0001")}
function playbackNeedsRender(previous,current){return !previous||mediaKey(previous)!==mediaKey(current)}
function syncPlaybackData(current){document.querySelectorAll("[data-playback-clock]").forEach(el=>clockData(el,current));updatePlaybackUI()}
function renderIfChanged(config,current,rows,force=false){const configKey=JSON.stringify(config),queueKey=rowsKey(rows);if(force||configKey!==lastRenderedConfig||queueKey!==lastRenderedRows||playbackNeedsRender(lastRenderedPlayback,current)){render(config,current,rows);lastRenderedConfig=configKey;lastRenderedRows=queueKey}else syncPlaybackData(current);lastRenderedPlayback=current}
function render(config,current,rows){const stage=$("stage"),item=current.candidate||current,next=(rows||[]).filter(row=>row.id!==current.entryId).map(row=>row.candidate?.title||row.query);for(const [name,value] of Object.entries({text:config.text,muted:config.muted,accent:config.accent,surface:rgb(config.surface),opacity:String(config.opacity/100),radius:`${config.radius}px`,gap:`${config.gap}px`,pad:`${config.padding}px`,width:`${config.width}px`,height:`${config.height||130}px`,scale:String((config.scale||100)/100),edge:`${config.accentWidth??4}px`,shadow:String((config.shadow??70)/100)}))document.documentElement.style.setProperty(`--${name}`,value);stage.className=`stage ${config.flow} ${config.anchor} content-${config.contentAlign||"start"}${config.separated?" separated":""}${config.opacity===0?" transparent":""}${config.autoHeight===false?" height-fixed":""}`;stage.replaceChildren(...config.segments.filter(row=>row.enabled).map(row=>segment(row,item,current,next,config.blockGap,config)).filter(Boolean));const identity=`${item.provider||current.provider}:${item.providerItemId||current.title}`;if(identity!==lastIdentity){if(config.motion==="subtle")stage.classList.add("subtle");if(config.motion==="slide")stage.classList.add("slide");lastIdentity=identity}stage.classList.toggle("hidden",!stage.childElementCount);updatePlaybackUI();scheduleMarquees()}
function clearPlayback(){lastPlayback=null;lastRenderedPlayback=null;lastIdentity="";lastRenderedRows="";$("stage").replaceChildren();$("stage").classList.add("hidden")}
async function refresh(){if(refreshing){pending=true;return}refreshing=true;try{const [playback,queue,overlay]=await Promise.all([call("song.playback.read.v1","status",null),call("song.queue.read.v1","status",{limit:6}),call("song.overlay.read.v1","status",null)]);lastConfig=overlay.config;if(!playback.primary){clearPlayback();return}lastPlayback=playback.primary;lastRows=queue.queue;renderIfChanged(previewConfig||lastConfig,lastPlayback,lastRows)}catch{if(!lastPlayback)clearPlayback()}finally{refreshing=false;if(pending){pending=false;void refresh()}}}
async function pollPlayback(){try{const playback=await call("song.playback.read.v1","status",null);if(!playback.primary){clearPlayback();return}lastPlayback=playback.primary;if(lastConfig)renderIfChanged(previewConfig||lastConfig,lastPlayback,lastRows)}catch{}}
eventListeners.add(()=>void refresh());void refresh();
updatePlaybackUI();setInterval(updatePlaybackUI,500);setInterval(()=>void pollPlayback(),2000);setInterval(()=>void refresh(),15000);
</script></body></html>
