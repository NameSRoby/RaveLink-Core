<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Now Playing Sources</title><style>
:root{color-scheme:dark;--bg:#050507;--panel:#0b101b;--edge:#263755;--text:#eef3ff;--muted:#8fa0be;--accent:#b31132;--ok:#57d487;--bad:#ff6b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif;letter-spacing:0}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--edge);background:#080b12}h1{margin:0;font-size:18px}.badge{font-size:11px;font-weight:800;color:var(--muted)}.badge.ok{color:var(--ok)}.badge.bad{color:var(--bad)}main{padding:18px;display:grid;grid-template-columns:minmax(300px,430px) minmax(320px,1fr);gap:18px}.section{border-top:1px solid var(--edge);padding-top:14px}h2{margin:0 0 12px;font-size:11px;color:#cdd8ee}.field{display:grid;gap:6px;color:var(--muted);font-size:10px;font-weight:800}.sourceRow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:16px}select,button{min-height:38px;border:1px solid var(--edge);border-radius:5px;background:#0a1020;color:var(--text);padding:8px 12px;font:inherit}button{font-weight:800;cursor:pointer}button:hover{border-color:#5c76a4}button.primary{border-color:var(--accent);background:var(--accent)}button:disabled{opacity:.45;cursor:default}.statusGrid{display:grid;grid-template-columns:auto 1fr;gap:9px 18px}.statusGrid span{color:var(--muted)}.track{min-height:126px;padding:16px;background:var(--panel);border-left:4px solid var(--accent)}.track strong,.track span{display:block}.track strong{font-size:21px}.track span{margin-top:7px;color:var(--muted)}.track .provider{font-size:10px;font-weight:900;color:#e21d48;margin-bottom:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.notice{min-height:20px;margin-top:12px;color:var(--muted);font-size:12px}.notice.bad{color:var(--bad)}@media(max-width:720px){main{grid-template-columns:1fr;padding:12px}header{padding:0 12px}.sourceRow{grid-template-columns:1fr}.track strong{font-size:18px}}
</style></head><body><header><h1>NOW PLAYING SOURCES</h1><span id="connection" class="badge">CHECKING</span></header><main><section class="section"><h2>ACTIVE OVERLAY SOURCE</h2><div class="sourceRow"><label class="field">SOURCE<select id="source"><option value="youtube">YOUTUBE // LOCAL PLAYER</option><option value="tidal">TIDAL // WINDOWS APP</option><option value="spotify">SPOTIFY // WINDOWS APP</option><option value="apple-music">APPLE MUSIC // WINDOWS APP</option></select></label><button id="select" class="primary" type="button">USE SOURCE</button></div><div class="statusGrid"><span>OBSERVER</span><strong id="state">STOPPED</strong><span>OBSERVATIONS</span><strong id="count">0</strong><span>LAST UPDATE</span><strong id="updated">NEVER</strong></div><div class="actions"><button id="start" type="button">START OBSERVER</button><button id="stop" type="button">STOP OBSERVER</button><button id="refresh" type="button">REFRESH</button></div><div id="notice" class="notice" role="status"></div></section><section class="section"><h2>OVERLAY OUTPUT</h2><div class="track"><span id="provider" class="provider">YOUTUBE</span><strong id="title">NOTHING PLAYING</strong><span id="artists">SELECT A SOURCE TO DISPLAY</span><span id="album"></span></div><div class="actions"><button id="overlay" type="button">OPEN OBS OVERLAY</button><button id="designer" type="button">OPEN OVERLAY DESIGNER</button></div></section></main><script>
const CHANNEL="ravelink-feature-ui-v1",pending=new Map(),listeners=new Set();let sequence=0,refreshing=false,refreshQueued=false;const $=id=>document.getElementById(id);
window.addEventListener("message",event=>{if(event.source!==parent||event.data?.channel!==CHANNEL)return;const message=event.data;if(message.type==="event"||message.type==="resync"){for(const listener of listeners)listener();return}const request=pending.get(message.id);if(!request)return;pending.delete(message.id);message.ok?request.resolve(message.value):request.reject(new Error(message.error||"Feature call failed"))});
function call(capability,method,payload=null){const id=`ui-${++sequence}`;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});parent.postMessage({channel:CHANNEL,type:"call",id,capability,method,payload},"*")})}
function notice(message,bad=false){$("notice").textContent=message;$("notice").className=`notice${bad?" bad":""}`}
function renderObserver(value){$("source").value=value.playbackSource||"youtube";const desktop=value.playbackSource!=="youtube";$("state").textContent=desktop?String(value.lifecycle||"unavailable").toUpperCase():"LOCAL PLAYER";$("count").textContent=String(value.counters?.observations||0);$("updated").textContent=value.lastObservedAt?new Date(value.lastObservedAt).toLocaleTimeString():"NEVER";$("start").disabled=!desktop||value.lifecycle==="active";$("stop").disabled=!desktop||value.lifecycle!=="active";$("connection").textContent=value.ok?"CONNECTED":"UNAVAILABLE";$("connection").className=`badge ${value.ok?"ok":"bad"}`}
function renderPlayback(value){const current=value.primary,item=current?.candidate||current,source=value.playbackSource||"youtube";$("provider").textContent=source.toUpperCase();$("title").textContent=item?.title||"NOTHING PLAYING";$("artists").textContent=(item?.artists||[]).join(", ")||"WAITING FOR SELECTED SOURCE";$("album").textContent=item?.album||""}
async function refresh(){if(refreshing){refreshQueued=true;return}refreshing=true;try{const [observer,playback]=await Promise.all([call("song.observer.admin.v1","status",null),call("song.playback.read.v1","status",null)]);renderObserver(observer);renderPlayback(playback)}catch(error){notice(error.message,true);$("connection").textContent="OFFLINE";$("connection").className="badge bad"}finally{refreshing=false;if(refreshQueued){refreshQueued=false;void refresh()}}}
async function control(action,payload={}){for(const button of document.querySelectorAll("button"))button.disabled=true;try{const result=await call("song.observer.admin.v1","control",{action,...payload});renderObserver(result);notice(action==="select"?`${result.playbackSource.toUpperCase()} is now the overlay source.`:`Observer ${action} complete.`,!result.ok)}catch(error){notice(error.message,true)}finally{await refresh()}}
$("select").onclick=()=>void control("select",{source:$("source").value});$("start").onclick=()=>void control("start");$("stop").onclick=()=>void control("stop");$("refresh").onclick=()=>void refresh();$("overlay").onclick=()=>parent.postMessage({channel:CHANNEL,type:"open",pageId:"obs-overlay"},"*");$("designer").onclick=()=>parent.postMessage({channel:CHANNEL,type:"open",pageId:"overlay-editor"},"*");listeners.add(()=>void refresh());void refresh();
</script></body></html>
