<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Queue</title><style>
:root{color-scheme:dark;--bg:#050507;--edge:#263755;--text:#eef3ff;--muted:#8fa0be;--ok:#57d487;--bad:#ff6b72}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px Segoe UI,Arial,sans-serif;letter-spacing:0}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--edge);background:#080b12}h1{margin:0;font-size:18px}.status{font-size:11px;font-weight:800;color:var(--muted)}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}main{padding:16px 18px}.toolbar,.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar{padding-bottom:14px;border-bottom:1px solid var(--edge)}.pager{justify-content:flex-end;padding-top:14px}.spacer{flex:1}button{min-height:38px;border:1px solid var(--edge);border-radius:5px;background:#0a1020;color:var(--text);padding:8px 11px;font:inherit;font-weight:800;cursor:pointer}button:hover:not(:disabled){border-color:#5c76a4}button.danger{color:#ff9fa4}button:disabled{opacity:.45;cursor:not-allowed}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--edge);vertical-align:middle}th{color:var(--muted);font-size:10px}td:last-child,th:last-child{text-align:right}.track strong,.track span{display:block}.track span,.requesterMeta{margin-top:3px;color:var(--muted);font-size:10px;text-transform:uppercase}.actions{display:flex;justify-content:flex-end;gap:6px}.actions button{min-height:30px;padding:4px 8px;font-size:10px}.empty{padding:36px 8px;color:var(--muted);text-align:center!important}.notice{min-height:20px;margin-right:auto;color:var(--muted);font-size:12px}.notice.bad{color:var(--bad)}@media(max-width:720px){main{padding:10px}header{padding:0 10px}.spacer,.hideSmall{display:none}.toolbar .status{width:100%}}
</style></head><body><header><h1>RAVELINK // REQUEST QUEUE</h1><span id="connection" class="status">CONNECTING</span></header><main><div class="toolbar"><button id="pause" type="button">PAUSE INTAKE</button><button id="resume" type="button">RESUME</button><button id="clear" class="danger" type="button">CLEAR QUEUE</button><span class="spacer"></span><span id="queueState" class="status">0 REQUESTS // FIFO</span></div><table><thead><tr><th>POSITION</th><th>TRACK</th><th>REQUESTER</th><th class="hideSmall">REQUESTED</th><th>ACTIONS</th></tr></thead><tbody id="queue"><tr><td class="empty" colspan="5">QUEUE EMPTY</td></tr></tbody></table><div class="pager"><span id="notice" class="notice" role="status"></span><button id="previous" type="button">PREVIOUS</button><span id="page" class="status">PAGE 1</span><button id="next" type="button">NEXT</button></div></main><script>
const CHANNEL="ravelink-feature-ui-v1",PAGE_SIZE=25;let sequence=0,offset=0,refreshing=false,queued=false;const pending=new Map(),listeners=new Set(),$=id=>document.getElementById(id);
window.addEventListener("message",event=>{if(event.source!==parent||event.data?.channel!==CHANNEL)return;const message=event.data;if(message.type==="transport-error"){$("connection").textContent="UPDATES OFFLINE";$("connection").className="status bad";return}if(message.type==="event"||message.type==="resync"){for(const listener of listeners)listener();return}const active=pending.get(message.id);if(!active)return;pending.delete(message.id);message.ok?active.resolve(message.value):active.reject(new Error(message.error||"Feature call failed"))});
function call(capability,method,payload=null){const id=`ui-${++sequence}`;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});parent.postMessage({channel:CHANNEL,type:"call",id,capability,method,payload},"*")})}
function notice(value,bad=false){$("notice").textContent=value;$("notice").className=`notice${bad?" bad":""}`}
function actionButton(label,title,handler,danger=false){const value=document.createElement("button");value.type="button";value.textContent=label;value.title=title;value.className=danger?"danger":"";value.onclick=handler;return value}
function render(state){const rows=state.queue||[],page=state.page||{},total=state.counts?.queued||0;if(!rows.length&&offset>0){offset=Math.max(0,offset-PAGE_SIZE);void refresh();return}$("queueState").textContent=`${state.paused?"PAUSED // ":""}${total} REQUEST${total===1?"":"S"} // FIFO`;$("queueState").className=`status${state.paused?" bad":total?" ok":""}`;$("previous").disabled=offset===0;$("next").disabled=!page.hasMore;$("page").textContent=`PAGE ${Math.floor(offset/PAGE_SIZE)+1}`;const body=$("queue");body.replaceChildren();if(!rows.length){const row=body.insertRow(),cell=row.insertCell();cell.colSpan=5;cell.className="empty";cell.textContent="QUEUE EMPTY";return}rows.forEach((item,index)=>{const row=body.insertRow();row.insertCell().textContent=String(offset+index+1);const track=row.insertCell(),title=document.createElement("strong"),provider=document.createElement("span");track.className="track";title.textContent=item.candidate?.title||item.query||"Untitled";provider.textContent=String(item.candidate?.provider||"youtube").toUpperCase();track.append(title,provider);const requester=row.insertCell();requester.textContent=item.requesterLabel||"Twitch user";const role=document.createElement("div");role.className="requesterMeta";role.textContent=item.requesterRole||"viewer";requester.append(role);const requested=row.insertCell();requested.className="hideSmall";requested.textContent=new Date(item.requestedAt||Date.now()).toLocaleTimeString();const actions=row.insertCell();actions.className="actions";actions.append(actionButton("REMOVE","Remove this request",()=>moderate({action:"remove",entryId:item.id},"Request removed.")),actionButton("BAN SONG","Block this video and remove matching requests",()=>moderate({action:"block_song",entryId:item.id},"Song blocked."),true))})}
async function refresh(){if(refreshing){queued=true;return}refreshing=true;try{const state=await call("song.queue.read.v1","status",{offset,limit:PAGE_SIZE,playlistLimit:1});render(state);$("connection").textContent="CONNECTED";$("connection").className="status ok"}catch(error){$("connection").textContent="DISCONNECTED";$("connection").className="status bad";notice(error.message,true)}finally{refreshing=false;if(queued){queued=false;void refresh()}}}
async function moderate(payload,message){try{const result=await call("song.queue.admin.v1","moderate",payload);if(!result.ok)throw new Error(result.reason||result.code||"Queue update failed");notice(message);await refresh()}catch(error){notice(error.message,true)}}
$("pause").onclick=()=>moderate({action:"pause"},"Request intake paused.");$("resume").onclick=()=>moderate({action:"resume"},"Request intake resumed.");$("clear").onclick=()=>{if(confirm("Clear every pending song request?"))void moderate({action:"clear"},"Request queue cleared.")};$("previous").onclick=()=>{offset=Math.max(0,offset-PAGE_SIZE);void refresh()};$("next").onclick=()=>{offset+=PAGE_SIZE;void refresh()};listeners.add(()=>void refresh());void refresh();
</script></body></html>
