function previewBlock(block){let el;switch(block.kind){case"label":el=node("div","pv label","NOW PLAYING");break;case"title":el=node("div","pv title","Example track with a long title that scrolls");break;case"artists":el=node("div","pv muted","Artist name");break;case"album":el=node("div","pv muted","Album title");break;case"artwork":el=node("div","pv artwork");break;case"provider":el=node("div","pv provider","YOUTUBE");break;case"time":el=node("div","pv muted","1:24 / 3:20");break;case"meta":el=node("div","pv meta");el.append(node("span","","YOUTUBE"),node("span","","1:24 / 3:20"));break;case"progress":el=node("div","pv progress");el.append(node("span"));break;default:el=node("div","pv queue","NEXT  //  Second track  /  Third track")}return applyBlockPreview(el,block)}
function rgba(hex,opacity){const clean=String(hex||"").slice(1),values=[0,2,4].map(index=>parseInt(clean.slice(index,index+2),16));return `rgba(${values.join(",")},${opacity/100})`}
function applySegmentPreview(el,row){const style=segmentStyle(row);if(style.surface)el.style.background=rgba(style.surface,style.opacity??config.opacity);if(style.accent)el.style.borderLeftColor=style.accent;if(style.opacity!==null&&!style.surface)el.style.background=rgba(config.surface,style.opacity);if(style.padding!==null)el.style.padding=`${style.padding}px`;if(style.radius!==null)el.style.borderRadius=`${style.radius}px`;if(style.accentWidth!==null)el.style.borderLeftWidth=`${style.accentWidth}px`;if(Object.values(style).some(value=>value!==""&&value!==null))el.style.borderLeftStyle="solid";return el}
function renderPreview(){recordDraft();const el=$("preview"),alpha=Math.round(config.opacity*2.55).toString(16).padStart(2,"0");for(const [key,value] of Object.entries({sgap:`${config.gap}px`,bgap:`${config.blockGap}px`,swidth:`${Math.min(config.width,760)}px`,sheight:`${Math.min(config.height,500)}px`,sscale:String(config.scale/100),spad:`${config.padding}px`,sradius:`${config.radius}px`,sedge:`${config.accentWidth}px`,sshadow:String(config.shadow/100),saccent:config.accent,ssurface:`${config.surface}${alpha}`,stext:config.text,smuted:config.muted}))el.style.setProperty(`--${key}`,value);el.className=`preview ${config.flow} ${config.anchor} content-${config.contentAlign}${config.separated?" separated":""}${config.autoHeight?"":" height-fixed"}`;el.replaceChildren(...config.segments.filter(row=>row.enabled).map(row=>{const segment=node("section",`preview-segment ${row.direction} ${row.align} ${row.size}`);segment.append(...row.blocks.map(previewBlock));return applySegmentPreview(segment,row)}))}
for(const id of ["flow","anchor","contentAlign","motion"])$(id).onchange=()=>{config[id]=$(id).value;changed(true)};$("heightMode").onchange=()=>{config.autoHeight=$("heightMode").value==="auto";changed(true)};for(const id of ["width","height","scale","gap","blockGap","radius","padding","opacity","accentWidth","shadow"])$(id).oninput=()=>{config[id]=Number($(id).value);changed(true)};for(const id of ["accent","surface","text","muted"])$(id).oninput=()=>{config[id]=$(id).value;changed()};$("separated").onchange=()=>{config.separated=$("separated").checked;changed()};$("addSegment").onclick=()=>{if(config.segments.length>=8)return status("Eight segment limit reached");config.segments.push({id:`segment-${Date.now().toString(36)}`,name:`Segment ${config.segments.length+1}`,enabled:true,direction:"column",align:"left",size:"wide",style:{surface:"",accent:"",opacity:null,padding:null,radius:null,accentWidth:null},blocks:[]});changed(true)};$("reset").onclick=()=>{config=structuredClone(DEFAULT);sync();status("Classic default restored locally")};$("save").onclick=async()=>{
  lock(true);
  try{
    const result=await call("song.overlay.admin.v1","configure",{config});
    config=result.config;baseline=JSON.stringify(config);sync();status("Overlay saved");
  }catch(error){status(error.message)}
  finally{lock(false)}
};function status(value){$("status").textContent=value}
function lock(value){document.querySelector("main").inert=value;for(const id of ["save","reset","discard"])$(id).disabled=value}
function draft(operation,value=null){
  const id=`draft-${++sequence}`;
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{pending.delete(id);reject(new Error("Draft storage did not respond"))},3000);
    pending.set(id,{resolve:value=>{clearTimeout(timer);resolve(value)},reject:error=>{clearTimeout(timer);reject(error)}});
    parent.postMessage({channel:CHANNEL,type:"draft",id,operation,value},"*");
  });
}
function recordDraft(){
  if(baseline===null)return;
  const current=JSON.stringify(config),value=current===baseline?null:JSON.stringify({version:1,baseline,config});
  $("discard").hidden=value===null;
  if(value===lastDraft)return;
  lastDraft=value;
  const revision=++draftRevision;
  draft("write",value).catch(()=>{if(revision===draftRevision){lastDraft=undefined;status("Draft recovery unavailable. Save before leaving.")}});
}
function validDraft(value){
  if(!value||value.version!==1||typeof value.baseline!=="string")return false;
  const c=value.config;
  if(!c||c.version!==3||!["classic","custom"].includes(c.preset)||typeof c.separated!=="boolean"||typeof c.autoHeight!=="boolean")return false;
  for(const [key,values] of Object.entries({flow:["column","row","grid"],anchor:["bottom-left","bottom-center","bottom-right","top-left","top-center","top-right"],contentAlign:["start","center","end"],motion:["off","subtle","slide"]}))if(!values.includes(c[key]))return false;
  for(const [key,[min,max]] of Object.entries({width:[240,960],height:[80,600],scale:[75,150],gap:[0,40],blockGap:[0,24],radius:[0,40],padding:[8,36],opacity:[0,100],accentWidth:[0,12],shadow:[0,100]}))if(!Number.isInteger(c[key])||c[key]<min||c[key]>max)return false;
  if(!["accent","surface","text","muted"].every(key=>/^#[0-9a-f]{6}$/i.test(c[key])))return false;
  if(!Array.isArray(c.segments)||c.segments.length>8)return false;
  const optional=(number,min,max)=>number===null||(Number.isInteger(number)&&number>=min&&number<=max),blockStyleValid=style=>style&&BLOCK_SIZES.includes(style.size)&&BLOCK_FONTS.includes(style.font)&&(style.color===""||/^#[0-9a-f]{6}$/i.test(style.color))&&[style.bold,style.italic,style.uppercase].every(value=>typeof value==="boolean"),segmentStyleValid=style=>style&&(style.surface===""||/^#[0-9a-f]{6}$/i.test(style.surface))&&(style.accent===""||/^#[0-9a-f]{6}$/i.test(style.accent))&&optional(style.opacity,0,100)&&optional(style.padding,0,48)&&optional(style.radius,0,48)&&optional(style.accentWidth,0,12);
  let count=0;
  return c.segments.every(row=>row&&typeof row.id==="string"&&row.id.length<=80&&typeof row.name==="string"&&row.name.length<=40&&typeof row.enabled==="boolean"&&["column","row"].includes(row.direction)&&["left","center","right"].includes(row.align)&&["compact","wide","full"].includes(row.size)&&segmentStyleValid(row.style)&&Array.isArray(row.blocks)&&row.blocks.every(block=>++count<=32&&block&&typeof block.id==="string"&&block.id.length<=80&&KINDS.includes(block.kind)&&blockStyleValid(block.style)&&(block.kind!=="queue"||(Number.isInteger(block.count)&&block.count>=1&&block.count<=5))));
}
$("discard").onclick=async()=>{
  lock(true);
  try{config=(await call("song.overlay.read.v1","status",null)).config;baseline=JSON.stringify(config);sync();status("Draft discarded")}
  catch(error){status(error.message)}finally{lock(false)}
};
renderPalette();lock(true);
(async()=>{
  try{
    config=(await call("song.overlay.read.v1","status",null)).config;baseline=JSON.stringify(config);
    try{
      const raw=await draft("read");
      if(raw!==null){
        const recovered=JSON.parse(raw);
        if(!validDraft(recovered))throw new Error("invalid_draft");
        config=recovered.config;
        status(recovered.baseline===baseline?"Unsaved draft recovered":"Draft recovered; the saved overlay has changed.");
      }
    }catch{status("Draft could not be recovered. The saved overlay is loaded.")}
    sync();lock(false);
  }catch(error){status(error.message)}
})();
