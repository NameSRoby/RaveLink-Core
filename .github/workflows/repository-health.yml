name: Repository health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and regression checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm.cmd ci
      - name: Install browser test runtime
        run: npx.cmd --no-install playwright install chromium
      - name: Verify source and generated payloads
        run: npm.cmd run verify:health
      - name: Run regression tests
        run: npm.cmd test
      - name: Audit production dependencies
        run: npm.cmd audit --omit=dev --audit-level=high
